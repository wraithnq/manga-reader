<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manga</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <span class="pill"><b id="mangaTitle">Manga</b></span>
  <a class="pill" id="readTopBtn" href="reader.html" style="text-decoration:none;color:#fff;">
    Читать →
  </a>
</header>

<main class="layout">

  <!-- LEFT SIDEBAR -->
  <aside class="side">
    <div class="sideCard">
      <img id="cover" class="coverSquare" src="cover.jpg" alt="cover" />

      <div class="sideTitle" id="titleSide">Manga</div>
      <div class="small" id="descSide">
        Загрузка описания…
      </div>

      <a class="primaryBtn" id="readBtn" href="reader.html">
        Начать читать →
      </a>
    </div>
  </aside>

  <!-- RIGHT CONTENT -->
  <section class="content">

    <!-- HERO -->
    <div class="card heroWide">
      <h1 id="titleTop" style="margin:0 0 8px 0;">Manga</h1>
      <p class="small" id="descTop">
        Загрузка описания…
      </p>
    </div>

    <!-- TABS -->
    <div class="card tabsCard">

      <div class="tabs">
        <button class="tab active" data-tab="about">О тайтле</button>
        <button class="tab" data-tab="chapters">Главы</button>
        <button class="tab" data-tab="comments">Комментарии</button>
      </div>

      <div class="tabContent">

        <!-- ABOUT -->
        <div class="tabPane active" id="tab-about">
          <div id="aboutText" class="aboutText">
            Загрузка описания…
          </div>
        </div>

        <!-- CHAPTERS -->
        <div class="tabPane" id="tab-chapters">
          <div id="chaptersList" class="chaptersNew"></div>
          <p class="small" id="emptyCh" style="display:none;">
            Пока нет глав.
          </p>
        </div>

        <!-- COMMENTS -->
        <div class="tabPane" id="tab-comments">
          <div class="small">
            Комментарии будут отображаться здесь.
          </div>
        </div>

      </div>
    </div>

  </section>
</main>

<script src="home.js?v=7"></script>

<!-- Tabs logic -->
<script>
  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;

      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      document.querySelectorAll(".tabPane").forEach(p => p.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
    });
  });
</script>

</body>
</html>
